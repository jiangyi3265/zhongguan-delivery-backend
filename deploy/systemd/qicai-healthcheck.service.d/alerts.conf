# Candidate for the existing 1.14.75.83 service, not installed by local acceptance.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 /etc/qicai/alert_runner.py --name health --state-dir /www/qicai/shared/alerts --config /etc/qicai/alerts-health.json -- /usr/bin/python3 /etc/qicai/healthcheck_server.py
UMask=0077
# Includes check timeout, up to ten pending HTTP sends, and owned process cleanup.
TimeoutStartSec=240
KillMode=control-group
