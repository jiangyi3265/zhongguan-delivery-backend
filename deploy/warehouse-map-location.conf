# Include inside the admin HTTPS server. Fixed public upstream, no API credentials.
location ^~ /warehouse-map/ {
    limit_except GET { deny all; }
    if ($uri !~ "^/warehouse-map/(styles|sprites|fonts|planet|natural_earth)(/|$)") { return 404; }
    if ($args != "") { return 400; }
    limit_req zone=qicai_map_requests burst=60 nodelay;
    limit_req_status 429;
    resolver 119.29.29.29 223.5.5.5 valid=300s ipv6=off;
    set $qicai_map_host tiles.openfreemap.org;
    rewrite ^/warehouse-map/(.*)$ /$1 break;
    proxy_pass https://$qicai_map_host$uri;
    proxy_pass_request_headers off;
    proxy_set_header Host $qicai_map_host;
    proxy_set_header User-Agent "ZhongguanWarehouseMaps/1.0 (https://dingdanht.uuok.top; contact: 529600491@qq.com)";
    proxy_set_header Referer "https://dingdanht.uuok.top/";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Accept-Encoding "";
    proxy_ssl_server_name on;
    proxy_ssl_name tiles.openfreemap.org;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_cache qicai_maps;
    proxy_cache_key $uri;
    proxy_cache_valid 200 7d;
    proxy_cache_lock on;
    proxy_cache_revalidate on;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
    proxy_hide_header Set-Cookie;
    add_header X-Map-Cache $upstream_cache_status always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
}
