# Prepared only. Do NOT include this file until filing, real certificates, SMS and WeChat domain checks are complete.
# Replace CERTIFICATE_PATH and PRIVATE_KEY_PATH with trusted certificate files for both domains.
# Include at http scope. Apply this policy to actual /profile alias locations too.
map $uri $qicai_upload_disposition {
    default attachment;
    ~*\.(png|jpe?g|gif|bmp|webp|ico|mp4|avi|rmvb)$ "";
}
server {
    listen 443 ssl;
    server_name dingdanht.uuok.top;
    ssl_certificate CERTIFICATE_PATH;
    ssl_certificate_key PRIVATE_KEY_PATH;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /www/qicai/current/admin;
    index index.html;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location / { try_files $uri $uri/ /index.html; }
    location ^~ /prod-api/ {
        proxy_pass http://127.0.0.1:18130/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /profile/ {
        proxy_pass http://127.0.0.1:18130;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        add_header Content-Disposition $qicai_upload_disposition always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
    location ~ /\. { deny all; }
}
server {
    listen 443 ssl;
    server_name dingdan.uuok.top;
    ssl_certificate CERTIFICATE_PATH;
    ssl_certificate_key PRIVATE_KEY_PATH;
    ssl_protocols TLSv1.2 TLSv1.3;
